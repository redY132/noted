[package]
name = "noted"
version = "0.1.0"
edition = "2021"
description = "Offline-first Noted desktop prototype"

[lib]
name = "noted_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "noted"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "semantic_benchmark"
required-features = ["semantic"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "semantic"]
semantic = ["dep:fastembed", "dep:usearch", "dep:reqwest", "dep:tokenizers"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
fs2 = "0.4"
fastembed = { version = "=7.5.0", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls"] }
usearch = { version = "=2.26.6", optional = true, default-features = false }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
tokenizers = { version = "=0.23.2", optional = true, default-features = false, features = ["onig"] }
